<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>紅龍傳說 — LEGEND OF THE RED DRAGON (1994)</title>
<style>
  :root{
    --cart-black:#0b0a0d;
    --cart-red:#7a1220;
    --cart-gold:#f2b33d;
    --cart-cream:#f5e6c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;
    background:
      radial-gradient(ellipse at 50% 30%, #241016 0%, #0b0a0d 60%, #050407 100%);
    overflow:hidden;
    font-family:"Courier New",monospace;
    color:var(--cart-cream);
  }
  #shell{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    gap:10px;
  }
  #bezel{
    position:relative;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(160deg,#2a1218 0%,#150a0e 45%,#0a0508 100%);
    box-shadow:
      0 0 0 2px #3d1a22,
      0 0 0 4px #0b0a0d,
      0 0 60px rgba(200,40,50,.20),
      0 24px 60px rgba(0,0,0,.8),
      inset 0 1px 0 rgba(242,179,61,.18);
  }
  #bezel:before{
    content:"RED DRAGON SOFTWARE";
    position:absolute;top:-1px;left:16px;
    transform:translateY(-100%);
    font-size:10px;letter-spacing:3px;
    color:#6a3a2a;
  }
  #bezel:after{
    content:"FC-1994 · 5000 UNITS";
    position:absolute;bottom:-1px;right:16px;
    transform:translateY(100%);
    font-size:10px;letter-spacing:2px;
    color:#4a2a22;
  }
  #game{
    line-height:0;
    border-radius:4px;
    overflow:hidden;
    background:#05040a;
    box-shadow:inset 0 0 0 2px #000;
  }
  #game canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  #legend{
    font-size:11px;letter-spacing:1.5px;
    color:#7a6a55;
    text-align:center;
    max-width:90vw;
  }
  #legend b{color:var(--cart-gold);font-weight:normal}
  #boot{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05040a;z-index:50;font-size:12px;letter-spacing:4px;color:#7a1220;
  }
  @media (max-height:560px){ #legend{display:none} #bezel{padding:6px} }
</style>
</head>
<body>
  <div id="shell">
    <div id="bezel"><div id="game"></div></div>
    <div id="legend">
      <b>&larr; &rarr;</b> MOVE &nbsp;·&nbsp; <b>Z / SPACE</b> JUMP (x2) &nbsp;·&nbsp;
      <b>X</b> STAFF (HOLD = SPIRIT BLAST) &nbsp;·&nbsp; <b>C / SHIFT</b> DASH &nbsp;·&nbsp;
      <b>&darr;</b> DROP THROUGH &nbsp;·&nbsp; <b>P</b> PAUSE &nbsp;·&nbsp; <b>V</b> CRT FILTER &nbsp;·&nbsp; <b>M</b> MUTE
    </div>
  </div>
  <div id="boot">LOADING CARTRIDGE&hellip;</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/palette.js"></script>
  <script src="src/pixel.js"></script>
  <script src="src/art_sprites.js"></script>
  <script src="src/art_world.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/level.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/scenes.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
